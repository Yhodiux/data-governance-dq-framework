decisions:
  - decision_id: GOV-DEC-001
    issue_id: GOV-ISS-001
    decision_type: REMEDIATION_AUTHORIZED
    status: EFFECTIVE
    policy_id: CARD-STD-001
    decision_date: null
    actor: null
    rationale: >-
      Source documentation defines card.issued as YYMMDD. The existing policy
      normalizes only the documented/observed physical suffix " 00:00:00",
      preserving the six digits. This Step 10 declaration references existing
      authorization and separate execution evidence, without asserting a causal
      chain between legacy DQ, standardization and TRUSTED DQ runs.
    evidence:
      - {type: METADATA, path: metadata/catalog/card.yaml, description: Documented YYMMDD representation supporting the decision.}
      - {type: METADATA, path: metadata/standardization/card.yaml, policy_id: CARD-STD-001, description: Existing strictly scoped normalization authorization.}
  - decision_id: GOV-DEC-002
