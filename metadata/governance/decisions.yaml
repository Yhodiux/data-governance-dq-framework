    status: ACTIVE
    policy_id: null
    decision_date: null
    actor: null
    rationale: >-
      The available evidence does not authorize mapping VYBER to another value
      or automatically extending the trans.type domain. The finding remains
      open pending a supported semantic decision. Withholding remediation is
      an explicit new project decision introduced in Step 10, not a historical
      decision inferred from the absence of transformation.
    evidence:
      - {type: METADATA, path: metadata/dq_rules/validity.yaml, rule_id: TRA-VAL-002, description: Scope of the recorded expectation.}
